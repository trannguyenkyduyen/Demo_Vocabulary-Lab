<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a41d36"><title>MY VOCABULARY LAB</title><style>
:root{--red:#a51d37;--ink:#35252a;--muted:#806f75;--line:#efdde1}*{box-sizing:border-box}body{margin:0;background:#fffaf9;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.wrap{max-width:1080px;margin:auto;padding:0 20px}.hero{background:linear-gradient(120deg,#86142b,#b82942);color:#fff;text-align:center;padding:65px 16px 55px;border-radius:0 0 30px 30px}.hero h1{font-size:clamp(32px,5.4vw,65px);line-height:1.15;letter-spacing:.025em;margin:0;font-weight:800}.copyright{font-size:clamp(11px,1.3vw,14px);opacity:.8;margin:24px 0 0}.main{padding-top:45px;padding-bottom:75px}.section-title{font-size:clamp(23px,3vw,29px);margin:0 0 22px}.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.grade{appearance:none;font:inherit;cursor:pointer;background:white;border:2px solid var(--line);border-radius:20px;padding:24px 12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;min-height:165px;transition:.18s;color:var(--ink)}.grade:hover{transform:translateY(-2px)}.grade:focus-visible{outline:3px solid #e9a5b3;outline-offset:3px}.grade[data-grade="10"]{border-color:#a6c8f5;color:#1757a3;background:#f3f8ff}.grade[data-grade="11"]{border-color:#a9dfb7;color:#217943;background:#f2fcf4}.grade[data-grade="12"]{border-color:#e7a9b5;color:#a51d37;background:#fff4f6}.grade[aria-pressed="true"]{border-width:3px;box-shadow:0 6px 22px #33333319;filter:saturate(1.12)}.grade .emoji{display:none}.grade .name{font-size:clamp(20px,2.5vw,28px);font-weight:750}.grade .status{font-size:12px;color:var(--muted)}.grade[aria-pressed="true"] .status{color:inherit;font-weight:700}.topics-head{margin:48px 0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.topics-head h2{margin:0;font-size:clamp(23px,3vw,29px)}.count{font-size:13px;color:var(--muted)}.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.topic{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;min-height:154px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink)}.topic .number{font-size:12px;color:var(--muted);font-weight:750;letter-spacing:.08em}.topic h3{font-size:19px;margin:0;line-height:1.3}.topic .bottom{margin-top:auto;font-size:13px;color:#918087}.topic.live{border-color:#e9adb8;background:linear-gradient(130deg,#fff,#fff5f6)}.topic.live .bottom{color:#208348;font-weight:750}.available{display:inline-flex;align-items:center;gap:6px;background:#e6f7eb;color:#16803d;border:1px solid #a9dfb7;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:750;width:max-content}.available:before{content:"✓";font-weight:900}.topic.live{border-color:#a9dfb7;background:linear-gradient(130deg,#fff,#f4fff7)}.topic.live:hover{box-shadow:0 8px 22px #a51d371a;transform:translateY(-2px)}.topic:not(.live){opacity:.72}.empty{background:#fff;border:1px dashed #e2bfc7;border-radius:18px;padding:38px 18px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:7px}.footer{text-align:center;padding:23px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}@media(max-width:750px){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:52px 14px 43px}.main{padding-top:32px}.grade{min-height:133px;padding:18px 8px}.grade .emoji{font-size:25px}}@media(max-width:470px){.grades{gap:9px}.grade .name{font-size:17px}.grade .status{font-size:10px}.topics{gap:10px}.topic{padding:16px;min-height:135px}.topic h3{font-size:16px}.topics-head{margin-top:35px}}

/* V6: compact grade selectors; color only on selection */
.grades{gap:12px;max-width:760px}
.grade,.grade[data-grade="10"],.grade[data-grade="11"],.grade[data-grade="12"]{background:#fff;color:var(--ink);border:1.5px solid #e7dfe1;border-radius:11px;min-height:66px;padding:12px 14px;gap:3px;box-shadow:none;filter:none}
.grade .name{font-size:clamp(16px,2vw,20px);font-weight:700}
.grade .status{font-size:11px;color:#8b7c80}
.grade[data-grade="10"][aria-pressed="true"]{background:#eaf3ff;border:2px solid #2b71cc;color:#1757a3}
.grade[data-grade="11"][aria-pressed="true"]{background:#eaf8ed;border:2px solid #2b9a53;color:#217943}
.grade[data-grade="12"][aria-pressed="true"]{background:#fff0f3;border:2px solid #ba2947;color:#a51d37}
.grade[aria-pressed="true"] .status{color:inherit;font-weight:600}
@media(max-width:470px){.grades{gap:7px}.grade,.grade[data-grade="10"],.grade[data-grade="11"],.grade[data-grade="12"]{min-height:59px;padding:9px 5px;border-radius:9px}.grade .name{font-size:15px}.grade .status{font-size:10px}}

/* V7: centered grade switcher and grade-aware topic palette */
.grades{margin:0 auto;max-width:630px;grid-template-columns:repeat(3,minmax(0,1fr))}
.main{--topic-accent:#a51d37;--topic-border:#edb4bf;--topic-tint:#fff0f3}
.main[data-active-grade="10"]{--topic-accent:#1757a3;--topic-border:#a9c9ee;--topic-tint:#edf5ff}
.main[data-active-grade="11"]{--topic-accent:#217943;--topic-border:#a7dcb5;--topic-tint:#effaf2}
.main[data-active-grade="12"]{--topic-accent:#a51d37;--topic-border:#edb4bf;--topic-tint:#fff0f3}
.topics-head{margin-top:42px}
.topics-head h2{color:var(--ink)}
.topic{border-color:var(--topic-border);background:linear-gradient(130deg,#fff 12%,var(--topic-tint) 100%)}
.topic .number{color:var(--topic-accent)}
.topic.live{border-color:var(--topic-border);background:linear-gradient(130deg,#fff 12%,var(--topic-tint) 100%)}
.topic.live:hover{box-shadow:0 8px 22px #33333316}
.topic:not(.live){opacity:.78}
@media(max-width:470px){.grades{max-width:100%}.topics-head{margin-top:30px}}
</style><style>
/* Dark mode: only darken surfaces; preserve grade colors and topic gradients */
html[data-lab-theme="dark"]{color-scheme:dark;--ink:#f4edf0;--muted:#bcb0b6;--line:#4a4149}
html[data-lab-theme="dark"] body{background:#15171d;color:#f4edf0}
html[data-lab-theme="dark"] .hero{background:linear-gradient(120deg,#86142b,#b82942)}
html[data-lab-theme="dark"] .grade{background:#262831;color:#f4edf0;border-color:#514751}
html[data-lab-theme="dark"] .grade[data-grade="10"][aria-pressed="true"]{background:#193454;border-color:#67aaff;color:#a8d3ff}
html[data-lab-theme="dark"] .grade[data-grade="11"][aria-pressed="true"]{background:#1b3c2b;border-color:#68c98b;color:#a9ebbd}
html[data-lab-theme="dark"] .grade[data-grade="12"][aria-pressed="true"]{background:#4a2431;border-color:#ef7893;color:#ffb5c5}
html[data-lab-theme="dark"] .grade .status{color:#bcb0b6}
html[data-lab-theme="dark"] .grade[aria-pressed="true"] .status{color:inherit}
html[data-lab-theme="dark"] .main[data-active-grade="10"]{--topic-accent:#8dc3ff;--topic-border:#3c6085;--topic-tint:#1e3149}
html[data-lab-theme="dark"] .main[data-active-grade="11"]{--topic-accent:#90e0a6;--topic-border:#3a7252;--topic-tint:#1d3929}
html[data-lab-theme="dark"] .main[data-active-grade="12"]{--topic-accent:#ffa5b8;--topic-border:#754455;--topic-tint:#3b2530}
html[data-lab-theme="dark"] .topic,html[data-lab-theme="dark"] .topic.live{background:linear-gradient(130deg,#282a33 12%,var(--topic-tint) 100%);border-color:var(--topic-border);color:#f4edf0}
html[data-lab-theme="dark"] .topic .number{color:var(--topic-accent)}
html[data-lab-theme="dark"] .topic .bottom{color:#c5b8bf}
html[data-lab-theme="dark"] .available{background:#20412f;color:#a9f2c4;border-color:#427c58}
html[data-lab-theme="dark"] .empty{background:#252730;color:#bcb0b6;border-color:#574750}
html[data-lab-theme="dark"] .empty strong{color:#f4edf0}
.theme-switch{position:fixed;top:14px;right:14px;z-index:99999;display:inline-flex;align-items:center;gap:7px;
 background:#fff!important;color:#6f2035!important;border:1px solid #e9b6c2!important;
 border-radius:999px;padding:9px 13px;font:700 13px system-ui,sans-serif;
 box-shadow:0 3px 15px #0002;cursor:pointer}
html[data-lab-theme="dark"] .theme-switch{background:#38323c!important;color:#ffe0e8!important;border-color:#a65b70!important}
.theme-switch:focus-visible{outline:3px solid #f09aaf;outline-offset:3px}
@media(max-width:520px){.theme-switch{top:9px;right:9px;padding:7px 10px;font-size:12px}}
</style><script>

</script></head><body><header class="hero"><div class="wrap"><h1>MY VOCABULARY LAB</h1><p class="copyright">© 2026 Trần Nguyễn Kỳ Duyên. All rights reserved.</p></div></header><main class="wrap main" data-active-grade="12"><section aria-labelledby="choose-grade"><div class="grades" role="group" aria-label="Choose your grade"><button type="button" class="grade" data-grade="10" aria-pressed="false"><span class="name">Grade 10</span><span class="status">11 topics</span></button><button type="button" class="grade" data-grade="11" aria-pressed="false"><span class="name">Grade 11</span><span class="status">15 topics</span></button><button type="button" class="grade" data-grade="12" aria-pressed="true"><span class="name">Grade 12</span><span class="status">1 topic available</span></button></div></section><section aria-labelledby="topics-title"><div class="topics-head"><h2 id="topics-title">Grade 12 · Topics</h2><span class="count" id="topic-count">21 topics</span></div><div id="topics-content" aria-live="polite"></div></section></main><footer class="footer">MY VOCABULARY LAB · © 2026 Trần Nguyễn Kỳ Duyên</footer><script>
const heading=document.getElementById('topics-title');
const buttons=[...document.querySelectorAll('.grade')], content=document.getElementById('topics-content'), count=document.getElementById('topic-count');
const topicsByGrade={
 '10':['Family','Green living','Entertainment','Volunteering','Science','Technology','Gender equality','International organisations','Education','Protecting the environment','Holidays and tourism'],
 '11':['Healthy lifestyle','Health','Food & drinks','Sports','The generation gap','Cities / Urbanization','Protecting the environment','Culture','Education options for school leavers','Career / Job','Becoming independent','Social issues','Economy','Politics','Endangered species'],
 '12':['Life Stories',...Array.from({length:20},(_,i)=>'Topic '+String(i+2).padStart(2,'0'))]
};
function showGrade(grade){
 document.querySelector('.main').dataset.activeGrade=grade;
 heading.textContent='Grade '+grade+' · Topics';
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.grade===grade)));
 const topics=topicsByGrade[grade];
 count.textContent=topics.length+' topics';
 const grid=document.createElement('div');grid.className='topics';
 topics.forEach((name,index)=>{
  const live=grade==='12'&&index===0;
  const el=document.createElement(live?'a':'article');el.className='topic'+(live?' live':'');
  if(live)el.href='life-stories.html';
  const no=String(index+1).padStart(2,'0');
  const number=document.createElement('span');number.className='number';number.textContent='TOPIC '+no;
  const title=document.createElement('h3');title.textContent=name;
  const bottom=document.createElement('span');bottom.className='bottom';
  if(live){const tag=document.createElement('span');tag.className='available';tag.textContent='Available';bottom.append(tag);}
  else bottom.textContent='Coming soon';
  el.append(number,title,bottom);grid.appendChild(el);
 });
 content.replaceChildren(grid);
}
buttons.forEach(b=>b.addEventListener('click',()=>showGrade(b.dataset.grade)));showGrade('12');
</script><button class="theme-switch" type="button" id="lab-theme-switch" aria-label="Chuyển chế độ sáng tối"></button>
<script>
(function(){
 const key='my-vocabulary-lab-theme',btn=document.getElementById('lab-theme-switch');
 function render(){
  const dark=document.documentElement.dataset.labTheme==='dark';
  btn.textContent=dark?'☀️ Chế độ sáng':'🌙 Chế độ tối';
  btn.setAttribute('aria-pressed',String(dark));
 }
 btn.addEventListener('click',function(){
  const next=document.documentElement.dataset.labTheme==='dark'?'light':'dark';
  document.documentElement.dataset.labTheme=next;
  try{localStorage.setItem(key,next)}catch(e){}
  render();
 });
 window.addEventListener('storage',function(e){
  if(e.key===key){document.documentElement.dataset.labTheme=e.newValue==='dark'?'dark':'light';render()}
 });
 render();
})();
</script></body></html>
