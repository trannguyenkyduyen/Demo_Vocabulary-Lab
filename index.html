   if(expand){btn.setAttribute('aria-expanded','true');modules.hidden=false;}
  });
  body.append(btn,modules);step.append(rail,body);path.appendChild(step);
 });
 wrap.appendChild(path);content.replaceChildren(wrap);
}
function showGrade(grade){
 if(grade==='ielts'){showIELTS();return;}

 document.querySelector('.main').dataset.activeGrade=grade;
 heading.textContent='Grade '+grade+' · Topics';
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.grade===grade)));
 const topics=topicsByGrade[grade];
 count.textContent=topics.length+' topics';
 const grid=document.createElement('div');grid.className='topics';
 topics.forEach((name,index)=>{
  const filename=topicFilesByGrade[grade][index];
  const no=String(index+1).padStart(2,'0');
  const el=document.createElement('article');el.className='topic';
  const number=document.createElement('span');number.className='number';number.textContent='TOPIC '+no;
  const title=document.createElement('h3');title.textContent=name;
  const bottom=document.createElement('span');bottom.className='bottom';bottom.textContent='Coming soon';
  el.append(number,title,bottom);grid.appendChild(el);
  function markAvailable(){
   if(el.dataset.ready==='yes')return;
   el.dataset.ready='yes';
   const link=document.createElement('a');link.className='topic live';link.href=filename;
   link.append(number,title,bottom);
   const tag=document.createElement('span');tag.className='available';tag.textContent='Available';
   bottom.replaceChildren(tag);el.replaceWith(link);
  }
  if(publishedTopics[grade].includes(filename)){
   markAvailable();
  }else{
   // Discover newly uploaded topics without needing to edit the homepage.
   fetch(filename,{method:'GET',cache:'no-store'}).then(response=>{
    if(response.ok && (el.isConnected || grid.contains(el)))markAvailable();
   }).catch(()=>{});
  }
 });
 content.replaceChildren(grid);
}
buttons.forEach(b=>b.addEventListener('click',()=>showGrade(b.dataset.grade)));showGrade('11');
</script><button class="theme-switch" type="button" id="lab-theme-switch" aria-label="Chuyển chế độ sáng tối"></button>
<script>
(function(){
 const key='my-vocabulary-lab-theme',btn=document.getElementById('lab-theme-switch');
 function render(){
  const dark=document.documentElement.dataset.labTheme==='dark';
  btn.textContent=dark?'☀️ Chế độ sáng':'🌙 Chế độ tối';
  btn.setAttribute('aria-pressed',String(dark));
 }
 btn.addEventListener('click',function(){
  const next=document.documentElement.dataset.labTheme==='dark'?'light':'dark';
  document.documentElement.dataset.labTheme=next;
  try{localStorage.setItem(key,next)}catch(e){}
  render();
 });
 window.addEventListener('storage',function(e){
  if(e.key===key){document.documentElement.dataset.labTheme=e.newValue==='dark'?'dark':'light';render()}
 });
 render();
})();
</script></body></html>
