const chooser=document.getElementById('chooser'),frame=document.getElementById('lab'),toolbar=document.getElementById('toolbar'),loading=document.getElementById('loading');
async function unpack(level){const data=document.getElementById('payload-'+level).textContent.trim();const binary=atob(data);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}
let requestId=0,activeLevel='';async function selectLevel(level){if(level===activeLevel&&frame.style.display==='block')return;const id=++requestId;activeLevel=level;document.body.classList.toggle('advanced-selected',level==='advanced');chooser.style.display='none';toolbar.style.display='flex';frame.style.display='none';loading.style.display='block';loading.textContent='Đang mở Vocabulary Lab...';document.querySelectorAll('.toolbar .tab').forEach(b=>{const selected=b.dataset.level===level;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});try{const html=await unpack(level);if(id!==requestId)return;frame.srcdoc=html;frame.style.display='block';loading.style.display='none';window.scrollTo(0,0)}catch(e){if(id!==requestId)return;loading.textContent='Không thể tải nội dung. Vui lòng mở trang bằng trình duyệt Chrome, Edge hoặc Safari phiên bản mới.';console.error(e)}}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>selectLevel(b.dataset.level)));

</script></body></html>
